[workspace]
members = ["crates/ds-ai"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "forbid"
unreachable_pub = "deny"
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
async-stream = "0.3.6"
async-trait = "0.1.89"
base64 = "0.23.1"
bytes = "1.11.1"
futures-core = "0.3.31"
futures-util = "0.3.34"
httpdate = "1.0.3"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = [
  "json",
  "rustls",
  "stream",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "test-util",
  "time",
] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tokio-tungstenite = { version = "0.30.0", features = [
  "rustls-tls-webpki-roots",
] }
url = "2.5.8"
sha2 = "0.10.9"
zstd = "0.13.3"
