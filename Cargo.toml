[workspace]
members = ["crates/ds-agent-core", "crates/ds-ai", "crates/ds-coding-agent"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "forbid"
unreachable_pub = "deny"
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
async-stream = "0.3.6"
async-trait = "0.1.89"
base64 = "0.23.1"
brotli = "8.0.2"
bytes = "1.11.1"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
flate2 = "1.1.1"
futures-core = "0.3.31"
futures-util = "0.3.34"
http = "1.4.0"
httpdate = "1.0.3"
jsonschema = { version = "0.17.1", default-features = false, features = [
  "draft202012",
] }
nix = { version = "0.31.3", features = ["process", "signal"] }
rand = "0.10.2"
ratatui = { version = "0.30.2", default-features = false, features = [
  "crossterm_0_29",
  "scrolling-regions",
] }
textarea = { package = "ratatui-textarea", version = "0.9.2", default-features = false, features = [
  "crossterm",
] }
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = [
  "brotli",
  "deflate",
  "gzip",
  "json",
  "rustls",
  "stream",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
thiserror = "2.0.20"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "test-util",
  "time",
] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tokio-tungstenite = { version = "0.30.0", features = [
  "rustls-tls-webpki-roots",
] }
url = "2.5.8"
sha2 = "0.10.9"
zstd = "0.13.3"
