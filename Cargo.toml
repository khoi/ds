[workspace]
members = ["crates/ds-ai"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
async-stream = "0.3.6"
base64 = "0.23.1"
bytes = "1.11.1"
futures-core = "0.3.31"
futures-util = "0.3.34"
httpdate = "1.0.3"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "test-util", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
zstd = "0.13.3"
